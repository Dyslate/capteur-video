<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capteur vidéo</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <div class="page">
      <img src="icons/icon32.png" alt="" width="20" height="20">
      <div class="page-text">
        <strong id="page-title">Capteur vidéo</strong>
        <span id="page-host" class="muted"></span>
      </div>
    </div>
    <div class="top-actions">
      <button id="scan" class="ghost" title="Scan the page for videos">Force detection</button>
      <button id="clear" class="icon ghost" title="Clear the list" aria-label="Clear the list">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="state" class="state" hidden>
      <div class="pulse" aria-hidden="true"><span></span><span></span><span></span></div>
      <p id="state-title">Waiting for media…</p>
      <p id="state-hint" class="muted">Play the video with the sound on, then come back here.</p>
    </section>

    <section id="medias" class="list" aria-label="Detected media"></section>

    <section id="jobs-section" hidden>
      <h2>Downloads</h2>
      <div id="jobs" class="list"></div>
    </section>
  </main>

  <footer class="bottom muted">
    <span>Personal use · free or your own content · <button id="open-log" class="link">Log</button></span>
    <span id="toast" role="status" aria-live="polite"></span>
  </footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
